repositories {
    mavenCentral()

    maven { url = 'https://files.minecraftforge.net/maven' }
    maven { url 'https://modmaven.dev/' }
    maven { url = "https://maven.itsmeow.dev/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url "https://maven.bai.lol" }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.paube.de/releases" }

    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Maxanier"
        url = "https://maven.maxanier.de/releases"
    }

    maven {
        name = "Evilcraft JFrog"
        url = "https://oss.jfrog.org/artifactory/simple/libs-release/"
    }
    maven {
        name = "ChickenBones"
        url = "https://chickenbones.net/maven/"
    }

    maven {
        name = "Minecolonies Maven - Newer"
        url = "https://ldtteam.jfrog.io/ldtteam/mods-maven"
    }

    maven {
        //Local repo for custom forge builds.
        //Is not required to exist
        name = "LocalForge"
        url = "../../MinecraftForge/repo/"
    }
    maven {
        name = "Local2"
        url = "../../../.m2/repository"
    }

}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'

        modSources project.sourceSets.main
    }
    client {
        systemProperty 'vampirism_target', 'dev'
        jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'mixin.debug.export', 'true'
    }

    server {
        systemProperty 'vampirism_target', 'dev'
        jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'vampirism_target', 'dev'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        systemProperty 'vampirism_target', 'dev_data'
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${forge_version}"

    // Vampirism - https://www.curseforge.com/minecraft/mc-mods/vampirism
    // Maven - https://maven.maxanier.de/releases/de/teamlapen/vampirism/Vampirism
    implementation "de.teamlapen.vampirism:Vampirism:${project.vampirism_mcversion}-${project.vampirism_version}"

    // Biomes O' Plenty - https://www.curseforge.com/minecraft/mc-mods/biomes-o-plenty
    if (include_biomes_o_plenty.toBoolean()) {
        implementation "curse.maven:BiomesOPlenty-220318:${project.bop_version}"
        implementation "curse.maven:BiomesOPlenty-955399:${project.glitch_core_version}"
    }

    // Terrablender - https://www.curseforge.com/minecraft/mc-mods/terrablender
    if (include_terrablender.toBoolean()) {
        runtimeOnly "com.github.glitchfiend:TerraBlender-neoforge:${project.minecraft_version}-${project.terrablender_version}"
    }

    // Hwyla / WTHIT - https://www.curseforge.com/minecraft/mc-mods/wthit-forge
    // Bad Packets - https://www.curseforge.com/minecraft/mc-mods/badpackets
    if (include_waila.toBoolean()) {
        compileOnly "mcp.mobius.waila:wthit-api:forge-${project.wthit_version}"
        runtimeOnly "mcp.mobius.waila:wthit:neo-${project.wthit_version}"
        runtimeOnly "lol.bai:badpackets:neo-${project.bad_packets_version}"
    }

    if (include_jade.toBoolean()) {
        implementation "curse.maven:jade-324717:${project.jade_version}"
    }

    // Tough as Nails - https://www.curseforge.com/minecraft/mc-mods/tough-as-nails
    if (include_tough_as_nails.toBoolean()) {
        implementation "curse.maven:ToughAsNails-246391:${project.tan_version}"
    }

    // Blood Magic - https://www.curseforge.com/minecraft/mc-mods/blood-magic
    if (include_bloodmagic.toBoolean()) {
        implementation "curse.maven:blood-magic-224791:${project.bloodmagic_fileid}"
    }

    // Evilcraft - https://www.curseforge.com/minecraft/mc-mods/evilcraft
    // Cyclops Core - https://www.curseforge.com/minecraft/mc-mods/cyclops-core
    if (include_evilcraft.toBoolean()) {
        implementation "curse.maven:evilcraft-74610:${project.evilcraft_fileid}"
        runtimeOnly "curse.maven:cyclops-core-232758:${project.cyclopscore_fileid}"
    }

    // Immersive Engineering - https://www.curseforge.com/minecraft/mc-mods/immersive-engineering
    if (include_immersive_engineering.toBoolean()) {
        implementation "curse.maven:immersive-engineering-231951:${project.immersiveengineering_fileid}"
    }

    // Mekanism - https://www.curseforge.com/minecraft/mc-mods/mekanism
    if (include_mekanism.toBoolean()) {
        compileOnly "mekanism:Mekanism:${project.mekanism_version}:api"
        runtimeOnly "mekanism:Mekanism:${project.mekanism_version}"
    }


    // Consecration - https://www.curseforge.com/minecraft/mc-mods/consecration
    if (include_consecration.toBoolean()) {
        implementation "curse.maven:consecration-284001:${project.consecration_fileid}"
    }

    // MCA Reborn - https://www.curseforge.com/minecraft/mc-mods/minecraft-comes-alive-reborn
    if (include_minecraft_comes_alive.toBoolean()) {
        implementation "curse.maven:minecraft-comes-alive-reborn-535291:${project.mca_fileid}"
    }

    // Nyctophobia / Graveyard biome - https://www.curseforge.com/minecraft/mc-mods/nyctophobia-forge
    if (include_nyctophobia.toBoolean()) {
        implementation "curse.maven:the-graveyard-biomes-forge-584868:${project.nyctophobia_fileid}"
    }

    // Minecolonies - https://www.curseforge.com/minecraft/mc-mods/minecolonies
    // Structurize - https://www.curseforge.com/minecraft/mc-mods/structurize
    // Domum Ornamentum - https://www.curseforge.com/minecraft/mc-mods/domum-ornamentum
    // Block UI - https://www.curseforge.com/minecraft/mc-mods/blockui
    if (include_minecolonies.toBoolean()) {
        implementation "curse.maven:minecolonies-245506:${project.minecolonies_version}"
        runtimeOnly "curse.maven:structurize-298744:${project.structurize_version}"
        runtimeOnly "curse.maven:domum-ornamentum-527361:${project.domum_ornamentum_version}"
        runtimeOnly "curse.maven:blockui-522992:${project.blockui_version}"
        runtimeOnly "curse.maven:towntalk-900364:${project.talktown_version}"
        runtimeOnly "curse.maven:multipiston-303278:${project.multipiston_version}"
    }

    // Tinkers Construction - https://www.curseforge.com/minecraft/mc-mods/tinkers-construct
    // Mantle - https://www.curseforge.com/minecraft/mc-mods/mantle
    if (include_tinkers_construction.toBoolean()) {
        implementation "slimeknights.tconstruct:TConstruct:${project.tconstruct_version}"
        runtimeOnly "slimeknights.mantle:Mantle:${project.mantle_version}"
    }

    // Survive - https://www.curseforge.com/minecraft/mc-mods/survive
    // UnionLib - https://www.curseforge.com/minecraft/mc-mods/unionlib
    if (include_survive.toBoolean()) {
        implementation "com.stereowalker.survive:Survive:${project.survive_version}"
        runtimeOnly "com.stereowalker.unionlib:UnionLib:${project.unionlib_version}"
        runtimeOnly "curse.maven:SereneSeasons-291874:${project.serene_seasons_version}"
    }

    // Diet - https://www.curseforge.com/minecraft/mc-mods/diet
    if (include_diet.toBoolean()) {
        implementation "curse.maven:diet-443570:${project.diet_fileid}"
    }

    // Architectury - https://www.curseforge.com/minecraft/mc-mods/architectury-api
    if (include_architectury.toBoolean()) {
        runtimeOnly "dev.architectury:architectury-neoforge:${project.architectury_version}"
    }

    if (include_betteranimalsplus.toBoolean()) {
        implementation "curse.maven:betteranimalsplus-303557:${project.betteranimalsplus_fileid}"
    }

    if (include_betteranimals.toBoolean()) {
        implementation "curse.maven:betteranimals-287443:${project.betteranimals_fileid}"
    }

    // Player Companions - https://www.curseforge.com/minecraft/mc-mods/player-companions
    if (include_player_companion.toBoolean()) {
        implementation "curse.maven:player-companions-552456:${project.playercompanion_fileid}"
    }

    // CraftTweaker
    if (include_crafttweaker.toBoolean()) {
        implementation "com.blamejared.crafttweaker:CraftTweaker-neoforge-${project.crafttweaker_version}"
    }

    // Guide API - https://www.curseforge.com/minecraft/mc-mods/guide-api-village-and-pillage
    if (include_guide_api.toBoolean()) {
        runtimeOnly "de.maxanier.guideapi:Guide-API-VP:${project.guideapi_version}"
    }

    // JEI - https://www.curseforge.com/minecraft/mc-mods/jei
    if (include_jei.toBoolean()) {
        compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}" //API for compile
        compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}" //API for compile
        runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}" //Full for runtime
    }

    if (include_cold_sweat.toBoolean()) {
        implementation "curse.maven:cold-sweat-506194:${project.coldsweat_fileid}"
    }

    if (include_guard_villagers.toBoolean()) {
        implementation "curse.maven:guardvillagers-360203:${project.guardvillagers_fileid}"
    }

    if (include_ctov.toBoolean()) {
        runtimeOnly "curse.maven:ctov-623908:${project.ctov_fileid}"
        runtimeOnly "curse.maven:lithostitched-936015:${project.lithostitched_fileid}"
    }
}

subsystems {
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
}